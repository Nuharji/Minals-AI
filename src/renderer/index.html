<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:" />
<title>Minals</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand">MINALS</div>
      <button id="settingsBtn" title="Einstellungen">⚙</button>
    </header>

    <main id="main">
      <div id="hud">
        <canvas id="hudCanvas" width="360" height="360"></canvas>
        <div id="hudStatus">Bereit</div>
      </div>

      <div id="chatPanel">
        <div id="chatLog"></div>
        <form id="chatForm">
          <button type="button" id="micBtn" title="Sprechen">🎤</button>
          <input type="text" id="chatInput" placeholder="Sag etwas zu Minals…" autocomplete="off" />
          <button type="submit" id="sendBtn">Senden</button>
        </form>
      </div>
    </main>
  </div>

  <div id="settingsOverlay" class="hidden">
    <div id="settingsPanel">
      <h2>Einstellungen</h2>

      <section>
        <h3>Lokales Sprachmodell (Ollama)</h3>
        <label>Ollama-Server</label>
        <input type="text" id="ollamaHost" placeholder="http://127.0.0.1:11434" />
        <label>Modell</label>
        <div class="row">
          <select id="ollamaModelSelect"></select>
          <button type="button" id="refreshModelsBtn" class="secondary" title="Modellliste neu laden">⟳</button>
        </div>
        <div class="row">
          <label class="checkbox"><input type="checkbox" id="toolsEnabled" /> System-Skills/Tools aktivieren</label>
        </div>
        <div class="row">
          <button id="saveOllamaSettingsBtn">Speichern</button>
        </div>
        <div id="ollamaStatus" class="status"></div>
      </section>

      <section>
        <h3>Sprachsteuerung (lokal)</h3>
        <label>whisper.cpp Binary-Pfad</label>
        <input type="text" id="sttBinaryPath" placeholder="/usr/local/bin/whisper-cli" />
        <label>whisper.cpp Modell-Pfad</label>
        <input type="text" id="sttModelPath" placeholder="/pfad/zu/ggml-base.bin" />
        <label>Piper Binary-Pfad</label>
        <input type="text" id="ttsBinaryPath" placeholder="/usr/local/bin/piper" />
        <label>Piper Stimme (.onnx)</label>
        <input type="text" id="ttsVoicePath" placeholder="/pfad/zu/de_DE-voice.onnx" />
        <div class="row">
          <label class="checkbox"><input type="checkbox" id="voiceEnabled" /> Sprachein-/ausgabe aktivieren</label>
        </div>
        <div class="row">
          <button id="saveVoiceSettingsBtn">Speichern</button>
        </div>
      </section>

      <section>
        <h3>Bildgenerierung (lokal, Stable Diffusion)</h3>
        <label>Automatic1111-Server</label>
        <input type="text" id="sdHost" placeholder="http://127.0.0.1:7860" />
        <label>Standard-Negativ-Prompt (optional)</label>
        <input type="text" id="sdNegativePrompt" placeholder="blurry, low quality" />
        <div class="row">
          <button id="saveSdSettingsBtn">Speichern</button>
        </div>
        <div class="status">Erfordert eine laufende Automatic1111-Instanz mit <code>--api</code>-Flag.</div>
      </section>

      <section>
        <h3>Erlaubte Shell-Befehle (Whitelist)</h3>
        <textarea id="allowedShellCommands" rows="3" placeholder="ls, df, uptime, uname, free"></textarea>
        <div class="row">
          <button id="saveShellWhitelistBtn">Speichern</button>
        </div>
      </section>

      <div class="row">
        <button id="closeSettingsBtn" class="secondary">Schliessen</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
